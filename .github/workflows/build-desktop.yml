name: Build Desktop App

on:
  push:
    branches: [develop, main, release]
    tags:
      - 'v*'
  pull_request:
    branches: [develop, main, release]
  workflow_dispatch:

jobs:
  macos:
    name: Build macOS installers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (backend/frontend/desktop)
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci
          npm --prefix desktop ci

      - name: Build official macOS installer artifacts
        run: ./Moj/build-oficjalna-instalka.sh

      - name: Collect macOS release artifacts
        run: |
          mkdir -p release-artifacts
          cp Moj/OpenTicket-Installer.pkg release-artifacts/
          cp Moj/OpenTicket-Installer.pkg.sha256 release-artifacts/
          cp Moj/OpenTicket-Installer.dmg release-artifacts/ || true
          cp Moj/OpenTicket-Installer.dmg.sha256 release-artifacts/ || true
          cp Moj/OpenTicket-Installer.zip release-artifacts/ || true
          cp Moj/OpenTicket-Installer.zip.sha256 release-artifacts/ || true
          cp Moj/latest-mac.yml release-artifacts/ || true
          cp Moj/latest-mac.yml.sha256 release-artifacts/ || true
          cp Moj/OpenTicket-*-arm64.zip release-artifacts/ || true
          cp Moj/OpenTicket-*-arm64.zip.blockmap release-artifacts/ || true
          cp Moj/OpenTicket-*-arm64.zip.blockmap.sha256 release-artifacts/ || true
          cp Moj/OpenTicket-*-arm64.dmg release-artifacts/ || true
          cp Moj/OpenTicket-*-arm64.dmg.blockmap release-artifacts/ || true
          cp Moj/OpenTicket-*-arm64.dmg.blockmap.sha256 release-artifacts/ || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-artifacts/
          retention-days: 30

  windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (backend/frontend/desktop)
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci
          npm --prefix desktop ci

      - name: Build official Windows installer artifacts
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\Moj\build-oficjalna-instalka-win.ps1

      - name: Collect Windows release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item -Force Moj\OpenTicket-Installer.exe release-artifacts\
          if (Test-Path Moj\OpenTicket-Installer.exe.sha256) { Copy-Item -Force Moj\OpenTicket-Installer.exe.sha256 release-artifacts\ }
          if (Test-Path Moj\OpenTicket-Portable.exe) { Copy-Item -Force Moj\OpenTicket-Portable.exe release-artifacts\ }
          if (Test-Path Moj\OpenTicket-Portable.exe.sha256) { Copy-Item -Force Moj\OpenTicket-Portable.exe.sha256 release-artifacts\ }
          if (Test-Path Moj\latest.yml) { Copy-Item -Force Moj\latest.yml release-artifacts\ }
          if (Test-Path Moj\latest.yml.sha256) { Copy-Item -Force Moj\latest.yml.sha256 release-artifacts\ }
          Get-ChildItem Moj -Filter "OpenTicket-Setup-*.exe*" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item -Force $_.FullName release-artifacts\ }
          Get-ChildItem Moj -Filter "OpenTicket-Portable-*.exe*" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item -Force $_.FullName release-artifacts\ }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-artifacts/
          retention-days: 30

  release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts/

      - name: Show collected release files
        run: ls -lah release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
